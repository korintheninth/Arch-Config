# Cache Folder
$cache_folder = $HOME/.cache/hyprland-dotfiles

# Source colors
source = colors.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = $cache_folder/current_wallpaper.png
}

input-field {
    monitor =
    size = 200, 35
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.10 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    inner_color = $color5
    font_color = $color1
    font_family = Departure Mono
    outer_color = $color1
    outline_thickness = 1
    fade_on_empty = false
    placeholder_text = <i>Input Password</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = 5 # -1 means complete rounding (circle/oval)
    check_color = $color1
    fail_color = $color1 # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, 100
    halign = center
    valign = bottom
    shadow_passes = 10
    shadow_size = 20
    shadow_color = $color6
    shadow_boost = 1.6
}

label {
    monitor =
    #clock
    text = cmd[update:1000] echo "$TIME"
    color = $color1
    font_size = 55
    font_family = Silkscreen
    position = 0, 150
    halign = center
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}
