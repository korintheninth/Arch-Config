<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="scan">
    <test name="family">
      <string>CozetteVector</string>
    </test>
    <edit name="spacing">
      <int>100</int>
    </edit>
    <edit name="scalable">
      <bool>true</bool>
    </edit>
</match>
<match target="font">
    <test name="family" compare="eq">
      <string>Departure Mono</string>
    </test>
    <edit name="antialias" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="hinting" mode="assign">
      <bool>false</bool>
    </edit>
  </match>
</fontconfig>
